# OpenClaw Kernel Parameters
# ==========================
# These parameters control hardware access and agent behavior at boot time.

# Core kernel parameters for full hardware access
# ------------------------------------------------
# Allow direct I/O port access (needed for video memory)
kernel.io_access=1

# Disable kernel lockdown for full /dev/mem access
kernel.lockdown=none

# Enable all kernel modules loading
kernel.modules_disabled=0

# Memory access parameters
# ------------------------
# Enable /dev/mem access for video memory and RAM
CONFIG_STRICT_DEVMEM=n
CONFIG_IO_STRICT_DEVMEM=n

# Framebuffer access
CONFIG_FB=y
CONFIG_FB_VESA=y
CONFIG_FRAMEBUFFER_CONSOLE=y

# Input device parameters
# -----------------------
CONFIG_INPUT_EVDEV=y
CONFIG_INPUT_MOUSEDEV=y
CONFIG_INPUT_KEYBOARD=y
CONFIG_INPUT_MOUSE=y
CONFIG_HID=y
CONFIG_USB_HID=y

# Storage access parameters
# -------------------------
CONFIG_BLK_DEV_SD=y
CONFIG_ATA=y
CONFIG_SATA_AHCI=y
CONFIG_NVME_CORE=y
CONFIG_NVME=y
CONFIG_EXT4_FS=y
CONFIG_VFAT_FS=y
CONFIG_NTFS_FS=y
CONFIG_BTRFS_FS=y

# DRM / Video memory access
# -------------------------
CONFIG_DRM=y
CONFIG_DRM_FBDEV_EMULATION=y

# Security parameters
# -------------------
# These are set to permissive for full access; the OpenClaw security
# scanner will audit and report on the security posture
CONFIG_SECURITY=y
CONFIG_SECCOMP=y
CONFIG_AUDIT=y
