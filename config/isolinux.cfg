# Vigil Bootable ISO - ISOLINUX Configuration
# Fallback bootloader for legacy BIOS systems

DEFAULT vigil
TIMEOUT 50
PROMPT 1

LABEL vigil
    MENU LABEL Vigil Agent Environment
    KERNEL /boot/vmlinuz
    APPEND initrd=/boot/initramfs.gz quiet loglevel=3 vigil.autostart=1 vigil.fullaccess=1

LABEL vigil-verbose
    MENU LABEL Vigil Agent (Verbose)
    KERNEL /boot/vmlinuz
    APPEND initrd=/boot/initramfs.gz vigil.autostart=1 vigil.fullaccess=1 vigil.debug=1

LABEL vigil-safe
    MENU LABEL Vigil Safe Mode
    KERNEL /boot/vmlinuz
    APPEND initrd=/boot/initramfs.gz quiet loglevel=3 vigil.autostart=1 vigil.fullaccess=0 vigil.safemode=1

LABEL shell
    MENU LABEL Drop to Shell
    KERNEL /boot/vmlinuz
    APPEND initrd=/boot/initramfs.gz quiet loglevel=3 vigil.autostart=0
