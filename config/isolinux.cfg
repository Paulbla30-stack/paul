# OpenClaw Bootable ISO - ISOLINUX Configuration
# Fallback bootloader for legacy BIOS systems

DEFAULT openclaw
TIMEOUT 50
PROMPT 1

LABEL openclaw
    MENU LABEL OpenClaw Agent Environment
    KERNEL /boot/vmlinuz
    APPEND initrd=/boot/initramfs.gz quiet loglevel=3 openclaw.autostart=1 openclaw.fullaccess=1

LABEL openclaw-verbose
    MENU LABEL OpenClaw Agent (Verbose)
    KERNEL /boot/vmlinuz
    APPEND initrd=/boot/initramfs.gz openclaw.autostart=1 openclaw.fullaccess=1 openclaw.debug=1

LABEL openclaw-safe
    MENU LABEL OpenClaw Safe Mode
    KERNEL /boot/vmlinuz
    APPEND initrd=/boot/initramfs.gz quiet loglevel=3 openclaw.autostart=1 openclaw.fullaccess=0 openclaw.safemode=1

LABEL shell
    MENU LABEL Drop to Shell
    KERNEL /boot/vmlinuz
    APPEND initrd=/boot/initramfs.gz quiet loglevel=3 openclaw.autostart=0
