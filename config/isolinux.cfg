# Jarvis Bootable ISO - ISOLINUX Configuration
# Fallback bootloader for legacy BIOS systems

DEFAULT jarvis
TIMEOUT 50
PROMPT 1

LABEL jarvis
    MENU LABEL Jarvis Agent Environment
    KERNEL /boot/vmlinuz
    APPEND initrd=/boot/initramfs.gz quiet loglevel=3 jarvis.autostart=1 jarvis.fullaccess=1

LABEL jarvis-verbose
    MENU LABEL Jarvis Agent (Verbose)
    KERNEL /boot/vmlinuz
    APPEND initrd=/boot/initramfs.gz jarvis.autostart=1 jarvis.fullaccess=1 jarvis.debug=1

LABEL jarvis-safe
    MENU LABEL Jarvis Safe Mode
    KERNEL /boot/vmlinuz
    APPEND initrd=/boot/initramfs.gz quiet loglevel=3 jarvis.autostart=1 jarvis.fullaccess=0 jarvis.safemode=1

LABEL shell
    MENU LABEL Drop to Shell
    KERNEL /boot/vmlinuz
    APPEND initrd=/boot/initramfs.gz quiet loglevel=3 jarvis.autostart=0
