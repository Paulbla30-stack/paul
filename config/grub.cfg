# OpenClaw Bootable ISO - GRUB Configuration
# =============================================

set timeout=5
set default=0

# Terminal setup
terminal_input console
terminal_output console

menuentry "OpenClaw Agent Environment" {
    linux /boot/vmlinuz quiet loglevel=3 openclaw.autostart=1 openclaw.fullaccess=1
    initrd /boot/initramfs.gz
}

menuentry "OpenClaw Agent Environment (Verbose Boot)" {
    linux /boot/vmlinuz openclaw.autostart=1 openclaw.fullaccess=1 openclaw.debug=1
    initrd /boot/initramfs.gz
}

menuentry "OpenClaw Agent - Safe Mode (No Hardware Direct Access)" {
    linux /boot/vmlinuz quiet loglevel=3 openclaw.autostart=1 openclaw.fullaccess=0 openclaw.safemode=1
    initrd /boot/initramfs.gz
}

menuentry "OpenClaw Security Scanner Only" {
    linux /boot/vmlinuz quiet loglevel=3 openclaw.autostart=1 openclaw.scanonly=1
    initrd /boot/initramfs.gz
}

menuentry "Drop to Shell" {
    linux /boot/vmlinuz quiet loglevel=3 openclaw.autostart=0
    initrd /boot/initramfs.gz
}
