# Vigil Bootable ISO - GRUB Configuration
# =============================================

set timeout=5
set default=0

# Terminal setup
terminal_input console
terminal_output console

menuentry "Vigil Agent Environment" {
    linux /boot/vmlinuz quiet loglevel=3 vigil.autostart=1 vigil.fullaccess=1
    initrd /boot/initramfs.gz
}

menuentry "Vigil Agent Environment (Verbose Boot)" {
    linux /boot/vmlinuz vigil.autostart=1 vigil.fullaccess=1 vigil.debug=1
    initrd /boot/initramfs.gz
}

menuentry "Vigil Agent - Safe Mode (No Hardware Direct Access)" {
    linux /boot/vmlinuz quiet loglevel=3 vigil.autostart=1 vigil.fullaccess=0 vigil.safemode=1
    initrd /boot/initramfs.gz
}

menuentry "Vigil Security Scanner Only" {
    linux /boot/vmlinuz quiet loglevel=3 vigil.autostart=1 vigil.scanonly=1
    initrd /boot/initramfs.gz
}

menuentry "Drop to Shell" {
    linux /boot/vmlinuz quiet loglevel=3 vigil.autostart=0
    initrd /boot/initramfs.gz
}
