# Jarvis Bootable ISO - GRUB Configuration
# =============================================

set timeout=5
set default=0

# Terminal setup
terminal_input console
terminal_output console

menuentry "Jarvis Agent Environment" {
    linux /boot/vmlinuz quiet loglevel=3 jarvis.autostart=1 jarvis.fullaccess=1
    initrd /boot/initramfs.gz
}

menuentry "Jarvis Agent Environment (Verbose Boot)" {
    linux /boot/vmlinuz jarvis.autostart=1 jarvis.fullaccess=1 jarvis.debug=1
    initrd /boot/initramfs.gz
}

menuentry "Jarvis Agent - Safe Mode (No Hardware Direct Access)" {
    linux /boot/vmlinuz quiet loglevel=3 jarvis.autostart=1 jarvis.fullaccess=0 jarvis.safemode=1
    initrd /boot/initramfs.gz
}

menuentry "Jarvis Security Scanner Only" {
    linux /boot/vmlinuz quiet loglevel=3 jarvis.autostart=1 jarvis.scanonly=1
    initrd /boot/initramfs.gz
}

menuentry "Drop to Shell" {
    linux /boot/vmlinuz quiet loglevel=3 jarvis.autostart=0
    initrd /boot/initramfs.gz
}
