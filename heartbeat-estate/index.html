<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heartbeat Estate — 3D</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a1030; }
  #c { display: block; width: 100vw; height: 100vh; cursor: grab; touch-action: none; }
  #c.dragging { cursor: grabbing; }
  .card {
    position: fixed; color: #eef2f8; font-family: Georgia, 'Times New Roman', serif;
    background: rgba(10, 16, 40, 0.62); border: 1px solid rgba(255,255,255,0.14);
    border-radius: 10px; padding: 12px 16px; backdrop-filter: blur(6px);
    user-select: none;
  }
  #title { top: 16px; left: 16px; }
  #title h1 { margin: 0; font-size: 22px; font-weight: normal; letter-spacing: 2px; }
  #title h1 .beat { display: inline-block; color: #ff5a6e; }
  #title p { margin: 4px 0 0; font-size: 12px; opacity: 0.75; font-family: system-ui, sans-serif; }
  #panel { top: 16px; right: 16px; font-family: system-ui, sans-serif; font-size: 12px; }
  #panel label { display: block; margin-bottom: 4px; opacity: 0.85; }
  #panel input[type=range] { width: 160px; accent-color: #ff5a6e; }
  #panel .row { margin-top: 8px; display: flex; gap: 6px; }
  #panel button {
    flex: 1; background: rgba(255,255,255,0.10); color: #eef2f8; font-size: 12px;
    border: 1px solid rgba(255,255,255,0.22); border-radius: 6px; padding: 5px 8px; cursor: pointer;
  }
  #panel button.on { background: rgba(255, 90, 110, 0.35); border-color: #ff5a6e; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title" class="card">
  <h1>H<span class="beat" id="beatChar">♥</span>ARTBEAT&nbsp;ESTATE</h1>
  <p>drag to orbit &nbsp;·&nbsp; scroll to zoom</p>
</div>
<div id="panel" class="card">
  <label>Heart rate: <b id="bpmLabel">64</b> bpm</label>
  <input id="bpm" type="range" min="42" max="160" value="64">
  <div class="row">
    <button id="dayBtn">Day</button>
    <button id="nightBtn" class="on">Dusk</button>
    <button id="spinBtn" class="on">Spin</button>
  </div>
</div>
<script>
'use strict';
// ---------------------------------------------------------------------------
// Heartbeat Estate — a self-contained 3D scene (no libraries).
// Canvas-2D painter's-algorithm renderer: flat-shaded polys, near-plane
// clipping, depth-sorted faces plus additive glow sprites, all driven by a
// shared cardiac phase so the whole estate beats in sync.
// ---------------------------------------------------------------------------
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ----- state ---------------------------------------------------------------
const cam = { yaw: 0.55, pitch: 0.34, dist: 66, target: [0, 5, 2] };
let autoSpin = true;
let bpm = 64;
let dayTarget = 0.35;      // 1 = noon, 0 = night; default dusk
let dayT = 0.35;
const NEAR = 1.5;

// optional URL params: ?day=1&bpm=90&yaw=1.2&pitch=0.5&dist=80
{
  const q = new URLSearchParams(location.search);
  if (q.has('bpm')) bpm = clamp2(+q.get('bpm'), 42, 160);
  if (q.has('yaw')) cam.yaw = +q.get('yaw');
  if (q.has('pitch')) cam.pitch = clamp2(+q.get('pitch'), 0.08, 1.25);
  if (q.has('dist')) cam.dist = clamp2(+q.get('dist'), 22, 150);
  if (q.get('day') === '1') { dayTarget = 1; dayT = 1; }
  function clamp2(v, a, b) { return isNaN(v) ? a : Math.min(b, Math.max(a, v)); }
}

// ----- ui ------------------------------------------------------------------
const bpmSlider = document.getElementById('bpm');
const bpmLabel = document.getElementById('bpmLabel');
bpmSlider.addEventListener('input', () => { bpm = +bpmSlider.value; bpmLabel.textContent = bpm; });
const dayBtn = document.getElementById('dayBtn');
const nightBtn = document.getElementById('nightBtn');
const spinBtn = document.getElementById('spinBtn');
function setDay(v) {
  dayTarget = v;
  dayBtn.classList.toggle('on', v === 1);
  nightBtn.classList.toggle('on', v !== 1);
}
dayBtn.addEventListener('click', () => setDay(1));
nightBtn.addEventListener('click', () => setDay(0.35));
bpmSlider.value = bpm; bpmLabel.textContent = bpm;
dayBtn.classList.toggle('on', dayTarget === 1);
nightBtn.classList.toggle('on', dayTarget !== 1);
spinBtn.addEventListener('click', () => { autoSpin = !autoSpin; spinBtn.classList.toggle('on', autoSpin); });

// ----- pointer controls ----------------------------------------------------
let dragging = false, lastX = 0, lastY = 0;
canvas.addEventListener('pointerdown', e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  canvas.classList.add('dragging'); canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  cam.yaw -= (e.clientX - lastX) * 0.005;
  cam.pitch = Math.min(1.25, Math.max(0.08, cam.pitch + (e.clientY - lastY) * 0.005));
  lastX = e.clientX; lastY = e.clientY;
});
window.addEventListener('pointerup', () => { dragging = false; canvas.classList.remove('dragging'); });
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  cam.dist = Math.min(150, Math.max(22, cam.dist * (1 + Math.sign(e.deltaY) * 0.08)));
}, { passive: false });

// ----- small math ----------------------------------------------------------
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const gauss = (x, mu, s) => Math.exp(-((x - mu) * (x - mu)) / (2 * s * s));
function mixCol(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }
function css(c, a) { return a === undefined ? `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})` : `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`; }

// ----- cardiac phase -------------------------------------------------------
// Twin-peaked "lub-dub" pulse; also a PQRST-ish trace for the monitor strip.
function pulseAt(p) { return gauss(p, 0.02, 0.045) + 0.5 * gauss(p, 0.20, 0.05); }
function ekgAt(p) {
  return 0.12 * gauss(p, 0.62, 0.025)        // P
       - 0.10 * gauss(p, 0.74, 0.012)        // Q
       + 1.00 * gauss(p, 0.78, 0.010)        // R
       - 0.26 * gauss(p, 0.82, 0.012)        // S
       + 0.30 * gauss(p, 0.95, 0.035);       // T
}

// ----- camera / projection -------------------------------------------------
let sy_, cy_, sp_, cp_, camPos, focal;
function updateCamera() {
  sy_ = Math.sin(cam.yaw); cy_ = Math.cos(cam.yaw);
  sp_ = Math.sin(cam.pitch); cp_ = Math.cos(cam.pitch);
  camPos = [
    cam.target[0] + cam.dist * sy_ * cp_,
    cam.target[1] + cam.dist * sp_,
    cam.target[2] + cam.dist * cy_ * cp_,
  ];
  focal = H * 1.15;
}
function toCam(p) {
  const tx = p[0] - camPos[0], ty = p[1] - camPos[1], tz = p[2] - camPos[2];
  const x1 = tx * cy_ - tz * sy_;
  const z1 = tx * sy_ + tz * cy_;
  return [x1, ty * cp_ - z1 * sp_, ty * sp_ + z1 * cp_];
}
function toScreen(c) { const iz = -1 / c[2]; return [W / 2 + focal * c[0] * iz, H / 2 - focal * c[1] * iz]; }
// Rotate a direction only (for sky objects pinned at infinity).
function dirToCam(d) {
  const x1 = d[0] * cy_ - d[2] * sy_;
  const z1 = d[0] * sy_ + d[2] * cy_;
  return [x1, d[1] * cp_ - z1 * sp_, d[1] * sp_ + z1 * cp_];
}
// Sutherland–Hodgman clip against the near plane (keep z <= -NEAR).
function clipNear(pts) {
  const out = [];
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length];
    const ain = a[2] <= -NEAR, bin = b[2] <= -NEAR;
    if (ain) out.push(a);
    if (ain !== bin) {
      const t = (-NEAR - a[2]) / (b[2] - a[2]);
      out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, -NEAR]);
    }
  }
  return out;
}

// ----- lighting ------------------------------------------------------------
let lightDir, ambient, diffuse, nightTint, fogCol;
function updateLight() {
  const d = dayT;
  const dayDir = [-0.45, 0.82, 0.36], nightDir = [0.3, 0.9, -0.2];
  const L = mixCol(dayDir, nightDir, 1 - d);
  const len = Math.hypot(L[0], L[1], L[2]);
  lightDir = [L[0] / len, L[1] / len, L[2] / len];
  ambient = lerp(0.24, 0.58, d);
  diffuse = lerp(0.30, 0.72, d);
  nightTint = mixCol([0.62, 0.70, 1.05], [1, 1, 1], d);
  fogCol = mixCol([26, 36, 74], [214, 233, 246], d);
}
function shadeFace(face, pts) {
  if (face.emis) {
    const c = face.col;
    return [c[0] * face.emis, c[1] * face.emis, c[2] * face.emis];
  }
  const [a, b, c] = pts;
  const u = [b[0] - a[0], b[1] - a[1], b[2] - a[2]];
  const v = [c[0] - a[0], c[1] - a[1], c[2] - a[2]];
  let nx = u[1] * v[2] - u[2] * v[1], ny = u[2] * v[0] - u[0] * v[2], nz = u[0] * v[1] - u[1] * v[0];
  const nl = Math.hypot(nx, ny, nz) || 1;
  nx /= nl; ny /= nl; nz /= nl;
  const dot = Math.abs(nx * lightDir[0] + ny * lightDir[1] + nz * lightDir[2]);
  const k = ambient + diffuse * dot;
  return [face.col[0] * k * nightTint[0], face.col[1] * k * nightTint[1], face.col[2] * k * nightTint[2]];
}

// ----- geometry builders ---------------------------------------------------
let items = [];
// opts: emis (0..1 self-lit), decal (flat ground layer drawn before sorted
// faces), bias (depth-sort nudge toward camera for faces stuck onto walls).
function face(pts, col, opts) {
  items.push({ pts, col, emis: opts && opts.emis, decal: opts && opts.decal, bias: (opts && opts.bias) || 0 });
}
function sprite(pos, r, col, a) { items.push({ sprite: true, pos, r, col, a }); }

// Box with center-of-base at (x, y, z).
function box(x, y, z, w, h, d, col, opts) {
  const hw = w / 2, hd = d / 2;
  const p = [
    [x - hw, y, z - hd], [x + hw, y, z - hd], [x + hw, y, z + hd], [x - hw, y, z + hd],
    [x - hw, y + h, z - hd], [x + hw, y + h, z - hd], [x + hw, y + h, z + hd], [x - hw, y + h, z + hd],
  ];
  face([p[3], p[2], p[6], p[7]], col, opts);    // front (+z)
  face([p[1], p[0], p[4], p[5]], col, opts);    // back
  face([p[0], p[3], p[7], p[4]], col, opts);    // left
  face([p[2], p[1], p[5], p[6]], col, opts);    // right
  face([p[4], p[5], p[6], p[7]], col, opts);    // top
}
// Gabled roof: ridge along the x-axis, eaves overhang.
function roof(x, y, z, w, d, rh, col, over) {
  const hw = w / 2 + over, hd = d / 2 + over;
  const a = [x - hw, y, z - hd], b = [x + hw, y, z - hd], c = [x + hw, y, z + hd], e = [x - hw, y, z + hd];
  const r1 = [x - hw, y + rh, z], r2 = [x + hw, y + rh, z];
  face([e, c, r2, r1], col);                     // front slope
  face([b, a, r1, r2], col);                     // back slope
  face([a, e, r1], mixCol(col, [0, 0, 0], 0.25)); // left gable
  face([c, b, r2], mixCol(col, [0, 0, 0], 0.25)); // right gable
}
function cylinder(x, y, z, r, h, col, n) {
  n = n || 10;
  for (let i = 0; i < n; i++) {
    const a0 = (i / n) * Math.PI * 2, a1 = ((i + 1) / n) * Math.PI * 2;
    const x0 = x + r * Math.cos(a0), z0 = z + r * Math.sin(a0);
    const x1 = x + r * Math.cos(a1), z1 = z + r * Math.sin(a1);
    face([[x0, y, z0], [x1, y, z1], [x1, y + h, z1], [x0, y + h, z0]], col);
  }
}
function disc(x, y, z, r, col, opts, n) {
  n = n || 20;
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    pts.push([x + r * Math.cos(a), y, z + r * Math.sin(a)]);
  }
  face(pts, col, opts);
}
function cone(x, y, z, r, h, col, n) {
  n = n || 9;
  const apex = [x, y + h, z];
  for (let i = 0; i < n; i++) {
    const a0 = (i / n) * Math.PI * 2, a1 = ((i + 1) / n) * Math.PI * 2;
    face([[x + r * Math.cos(a0), y, z + r * Math.sin(a0)], [x + r * Math.cos(a1), y, z + r * Math.sin(a1)], apex], col);
  }
}
function ring(x, y, z, r0, r1, col, opts, n) {
  n = n || 36;
  for (let i = 0; i < n; i++) {
    const a0 = (i / n) * Math.PI * 2, a1 = ((i + 1) / n) * Math.PI * 2;
    face([
      [x + r0 * Math.cos(a0), y, z + r0 * Math.sin(a0)],
      [x + r1 * Math.cos(a0), y, z + r1 * Math.sin(a0)],
      [x + r1 * Math.cos(a1), y, z + r1 * Math.sin(a1)],
      [x + r0 * Math.cos(a1), y, z + r0 * Math.sin(a1)],
    ], col, opts);
  }
}

// Extruded heart, classic parametric outline, rotated `rot` about Y.
const HEART_N = 26;
const heartOutline = [];
for (let i = 0; i < HEART_N; i++) {
  const t = (i / HEART_N) * Math.PI * 2;
  heartOutline.push([
    0.062 * 16 * Math.pow(Math.sin(t), 3),
    0.062 * (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) + 0.22,
  ]);
}
function heart(x, y, z, scale, rot, thick, col, emis) {
  const cr = Math.cos(rot), sr = Math.sin(rot);
  const front = [], back = [];
  for (const [hx, hy] of heartOutline) {
    const px = hx * scale, py = hy * scale;
    front.push([x + px * cr - thick * sr, y + py, z + px * sr + thick * cr]);
    back.push([x + px * cr + thick * sr, y + py, z + px * sr - thick * cr]);
  }
  for (let i = 0; i < HEART_N; i++) {
    const j = (i + 1) % HEART_N;
    face([front[i], front[j], back[j], back[i]], mixCol(col, [0, 0, 0], 0.22), { emis });
  }
  face(front, col, { emis });
  face(back, col, { emis });
}

// ----- scene ---------------------------------------------------------------
const treeSpots = [
  [-26, -14, 1.15], [-32, 6, 1.3], [-22, 24, 1.0], [26, -12, 1.2],
  [33, 8, 1.05], [23, 26, 1.25], [-14, 38, 0.95], [15, 40, 1.1],
  [-38, 30, 1.2], [38, 32, 1.0],
];
const lampSpots = [];
for (let i = 0; i < 3; i++) {
  lampSpots.push([-4.4, 14 + i * 9], [4.4, 14 + i * 9]);
}
const stars = [];
{
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 130; i++) {
    const az = rnd() * Math.PI * 2, el = 0.06 + rnd() * 1.35;
    stars.push([Math.cos(el) * Math.sin(az), Math.sin(el), Math.cos(el) * Math.cos(az), 0.4 + rnd() * 0.9]);
  }
}

function buildScene(time, pulse, night) {
  items = [];
  const glow = night * (0.55 + 0.45 * pulse);   // lights breathe with the beat

  // --- grounds (flat decals, slightly above y=0 in build order) ---
  const grass = mixCol([64, 108, 58], [86, 142, 74], dayT);
  face([[-95, 0, -95], [95, 0, -95], [95, 0, 95], [-95, 0, 95]], grass, { decal: true });
  const gravel = [176, 166, 148];
  face([[-3.4, 0.02, 8], [3.4, 0.02, 8], [3.4, 0.02, 46], [-3.4, 0.02, 46]], gravel, { decal: true }); // entry drive
  ring(0, 0.02, 0, 7.6, 11, gravel, { decal: true });                                                  // circular drive
  face([[-2.6, 0.02, -11], [2.6, 0.02, -11], [2.6, 0.02, -7.6], [-2.6, 0.02, -7.6]], gravel, { decal: true }); // steps to house

  // --- fountain of the heart ---
  cylinder(0, 0, 0, 6.2, 1.1, [168, 162, 150], 18);
  ring(0, 1.12, 0, 5.0, 6.2, [188, 182, 170], undefined, 18);
  const water = mixCol([46, 92, 140], [80, 150, 195], dayT);
  disc(0, 0.95, 0, 5.0, mixCol(water, [180, 230, 255], 0.25 * pulse), { emis: night > 0.4 ? 0.55 + 0.35 * pulse : 0 }, 22);
  box(0, 1.0, 0, 2.2, 1.6, 2.2, [150, 145, 135]);                    // plinth
  const heartScale = 2.6 * (1 + 0.10 * pulse);
  heart(0, 3.0, 0, heartScale, time * 0.45, 0.42, [212, 38, 64], 0.75 + 0.45 * pulse);
  sprite([0, 4.6, 0], 4.2 + 2.4 * pulse, [255, 60, 84], 0.10 + 0.20 * pulse + 0.12 * night);

  // --- the manor ---
  const MZ = -21;
  const wall = [212, 198, 176], wing = [200, 186, 164], slate = [88, 96, 110];
  box(0, 0, MZ, 24, 9, 11, wall);
  roof(0, 9, MZ, 24, 11, 4.2, slate, 0.7);
  box(-17, 0, MZ + 1, 11, 6.5, 9, wing);
  roof(-17, 6.5, MZ + 1, 11, 9, 3.2, slate, 0.6);
  box(17, 0, MZ + 1, 11, 6.5, 9, wing);
  roof(17, 6.5, MZ + 1, 11, 9, 3.2, slate, 0.6);
  box(-6, 12.2, MZ - 1, 1.4, 2.6, 1.4, [140, 120, 110]);             // chimneys
  box(7, 12.2, MZ - 1, 1.4, 2.6, 1.4, [140, 120, 110]);

  // portico
  const PZ = MZ + 5.5;
  box(-2.2, 0, PZ + 1.4, 0.55, 4.6, 0.55, [225, 218, 205]);
  box(2.2, 0, PZ + 1.4, 0.55, 4.6, 0.55, [225, 218, 205]);
  box(0, 4.6, PZ + 0.9, 7, 0.7, 3.4, [222, 214, 200]);
  roof(0, 5.3, PZ + 0.9, 7, 3.4, 1.3, slate, 0.3);
  face([[-1.3, 0.04, PZ + 0.02], [1.3, 0.04, PZ + 0.02], [1.3, 3.6, PZ + 0.02], [-1.3, 3.6, PZ + 0.02]], [86, 54, 38], { bias: 2 }); // door

  // windows — lit from within after dark, beating faintly
  const winCol = night > 0.35 ? [255, 214, 150] : [150, 185, 210];
  const winEmis = night > 0.35 ? 0.72 + 0.25 * pulse * night : 0.9;
  const zf = MZ + 5.56, zw = MZ + 5.56;
  for (const wx of [-9, -5.4, 5.4, 9]) {
    face([[wx - 0.85, 1.6, zf], [wx + 0.85, 1.6, zf], [wx + 0.85, 4.2, zf], [wx - 0.85, 4.2, zf]], winCol, { emis: winEmis, bias: 2 });
  }
  for (const wx of [-9, -5.4, 0, 5.4, 9]) {
    face([[wx - 0.85, 5.6, zf], [wx + 0.85, 5.6, zf], [wx + 0.85, 7.9, zf], [wx - 0.85, 7.9, zf]], winCol, { emis: winEmis, bias: 2 });
  }
  for (const wx of [-19.5, -14.5, 14.5, 19.5]) {
    face([[wx - 0.8, 2.2, zw], [wx + 0.8, 2.2, zw], [wx + 0.8, 4.8, zw], [wx - 0.8, 4.8, zw]], winCol, { emis: winEmis * 0.92, bias: 2 });
  }

  // --- hedges, gate, trees, lamps ---
  box(-13.5, 0, 11.5, 15, 1.5, 1.6, [44, 88, 48]);
  box(13.5, 0, 11.5, 15, 1.5, 1.6, [44, 88, 48]);
  for (const gx of [-4.6, 4.6]) {
    box(gx, 0, 43.5, 1.6, 4.2, 1.6, [158, 152, 142]);
    cone(gx, 4.2, 43.5, 1.1, 1.2, [140, 134, 124], 4);
    sprite([gx, 4.9, 43.5], 1.6, [255, 200, 120], 0.5 * glow);
  }
  for (const [tx, tz, ts] of treeSpots) {
    box(tx, 0, tz, 0.8 * ts, 2.4 * ts, 0.8 * ts, [104, 76, 52]);
    cone(tx, 1.8 * ts, tz, 2.6 * ts, 4.4 * ts, [50, 98, 56], 8);
    cone(tx, 4.4 * ts, tz, 1.9 * ts, 3.4 * ts, [58, 110, 62], 8);
  }
  for (const [lx, lz] of lampSpots) {
    box(lx, 0, lz, 0.22, 3.0, 0.22, [50, 54, 62]);
    box(lx, 3.0, lz, 0.55, 0.6, 0.55, [255, 208, 130], { emis: 0.55 + 0.45 * glow });
    sprite([lx, 3.3, lz], 2.0 + 0.7 * pulse * night, [255, 200, 120], 0.55 * glow);
  }
}

// ----- sky -----------------------------------------------------------------
function drawSky(night) {
  const top = mixCol([9, 14, 44], [116, 186, 228], dayT);
  const bot = mixCol([28, 40, 82], [214, 236, 248], dayT);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, css(top));
  g.addColorStop(1, css(bot));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  if (night > 0.05) {
    ctx.fillStyle = `rgba(235,240,255,${0.9 * night})`;
    for (const [dx, dy, dz, sz] of stars) {
      const c = dirToCam([dx, dy, dz]);
      if (c[2] > -0.1) continue;
      const s = toScreen([c[0] * 50, c[1] * 50, c[2] * 50]);
      if (s[1] < H * 0.75) ctx.fillRect(s[0], s[1], sz, sz);
    }
  }
  // sun / moon riding the light direction
  const c = dirToCam(lightDir);
  if (c[2] < -0.1) {
    const s = toScreen([c[0] * 60, c[1] * 60, c[2] * 60]);
    const r = lerp(26, 34, dayT);
    const col = mixCol([228, 232, 245], [255, 236, 170], dayT);
    const g2 = ctx.createRadialGradient(s[0], s[1], 2, s[0], s[1], r * 2.4);
    g2.addColorStop(0, css(col, 0.95));
    g2.addColorStop(0.35, css(col, lerp(0.5, 0.7, dayT)));
    g2.addColorStop(1, css(col, 0));
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.arc(s[0], s[1], r * 2.4, 0, 7); ctx.fill();
  }
}

// ----- monitor strip -------------------------------------------------------
function drawEkg(time, pulse) {
  const h = 64, y0 = H - h;
  ctx.fillStyle = 'rgba(6,10,26,0.72)';
  ctx.fillRect(0, y0, W, h);
  ctx.strokeStyle = 'rgba(90,255,150,0.10)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let gx = 0; gx < W; gx += 34) { ctx.moveTo(gx, y0); ctx.lineTo(gx, H); }
  for (let gy = y0; gy < H; gy += 16) { ctx.moveTo(0, gy); ctx.lineTo(W, gy); }
  ctx.stroke();

  const period = 60 / bpm, window_ = 4;
  ctx.strokeStyle = 'rgb(96,255,150)';
  ctx.lineWidth = 2;
  ctx.shadowColor = 'rgb(96,255,150)';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  for (let x = 0; x <= W - 130; x += 2) {
    const tt = time - window_ * (1 - x / (W - 130));
    const p = ((tt / period) % 1 + 1) % 1;
    const yy = y0 + h * 0.62 - ekgAt(p) * h * 0.5;
    x === 0 ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy);
  }
  ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.fillStyle = 'rgb(96,255,150)';
  ctx.font = '600 20px system-ui, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(`${bpm}`, W - 58, y0 + 38);
  ctx.font = '11px system-ui, sans-serif';
  ctx.fillText('BPM', W - 58, y0 + 52);
  ctx.fillStyle = `rgba(255,80,100,${0.5 + 0.5 * pulse})`;
  ctx.font = `${18 + 7 * pulse}px serif`;
  ctx.fillText('♥', W - 22, y0 + 40);
  ctx.textAlign = 'left';
}

// ----- render loop ---------------------------------------------------------
const beatChar = document.getElementById('beatChar');
let t0 = performance.now();
function frame(now) {
  const time = (now - t0) / 1000;
  dayT += (dayTarget - dayT) * 0.04;
  const night = 1 - dayT;
  const period = 60 / bpm;
  const phase = (time / period) % 1;
  const pulse = clamp(pulseAt(phase), 0, 1);

  if (autoSpin && !dragging) cam.yaw += 0.0016;
  updateCamera();
  updateLight();

  drawSky(night);
  buildScene(time, pulse, night);

  // project + depth; ground decals render first in insertion order so the
  // huge lawn quad can never depth-average its way in front of buildings
  const drawList = [], decals = [];
  for (const it of items) {
    if (it.sprite) {
      const c = toCam(it.pos);
      if (c[2] > -NEAR) continue;
      drawList.push({ z: c[2], sprite: it, c });
      continue;
    }
    const cpts = it.pts.map(toCam);
    const clipped = clipNear(cpts);
    if (clipped.length < 3) continue;
    let zsum = 0;
    for (const c of cpts) zsum += c[2];
    const entry = { z: zsum / cpts.length + it.bias, realZ: zsum / cpts.length, face: it, spts: clipped.map(toScreen) };
    (it.decal ? decals : drawList).push(entry);
  }
  drawList.sort((a, b) => a.z - b.z);   // farthest (most negative) first

  for (const d of decals.concat(drawList)) {
    if (d.sprite) {
      const s = toScreen(d.c);
      const r = Math.max(2, focal * d.sprite.r / -d.c[2]);
      const g = ctx.createRadialGradient(s[0], s[1], 0, s[0], s[1], r);
      g.addColorStop(0, css(d.sprite.col, clamp(d.sprite.a, 0, 1)));
      g.addColorStop(1, css(d.sprite.col, 0));
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(s[0], s[1], r, 0, 7); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      continue;
    }
    let col = shadeFace(d.face, d.face.pts);
    col = mixCol(col, fogCol, clamp((-d.realZ - 70) / 160, 0, 0.6));
    const fill = css(col);
    ctx.fillStyle = fill;
    ctx.strokeStyle = fill;   // seam-hiding stroke
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(d.spts[0][0], d.spts[0][1]);
    for (let i = 1; i < d.spts.length; i++) ctx.lineTo(d.spts[i][0], d.spts[i][1]);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }

  drawEkg(time, pulse);
  beatChar.style.transform = `scale(${1 + 0.35 * pulse})`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
