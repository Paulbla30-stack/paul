AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  JARVIS scout, Stage 1 — finds and logs public discussions relevant to
  Paul Blatherwick's work, and emails a daily digest. It never posts
  anywhere and calls no model.

  Personal to JARVIS. Strictly firewalled from Arkin Engine Ltd: no Arkin
  code, accounts or data. No access to the heartbeat-memory server. No
  credentials for any posting account.

Parameters:
  DigestHour:
    Type: String
    Default: '7'
    Description: Local hour (Europe/London) to send the digest.
  ApprovalSecretName:
    Type: String
    Default: /jarvis/scout/approval-key
    Description: >
      SSM SecureString holding the HMAC key that signs approval links.
      Created by scripts/deploy.py, not by this template: CloudFormation
      cannot create a SecureString parameter.
  Enabled:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Set false to pause the schedule without deleting the stack.

Globals:
  Function:
    Runtime: python3.12          # tomllib is stdlib from 3.11; config.toml needs it
    MemorySize: 512
    Timeout: 600                 # arXiv backoff alone can take ~45s, and on
                                 # 23 Sep 2026 a slow medRxiv spent 234s of
                                 # the old 300 and the run hit the wall. Each
                                 # source now has its own budget; this is the
                                 # ceiling above five of them, not a licence
                                 # for one. Lambda bills used time, so a
                                 # higher limit costs nothing on a normal day.
    Architectures: [arm64]       # ~20% cheaper per GB-second than x86_64

Resources:

  # ---------------------------------------------------------------------
  # Storage. One table holds the hits and the hash chain. On-demand
  # billing: no hourly cost, nothing to leave running by accident.
  # ---------------------------------------------------------------------
  ScoutTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain       # the chain is the record; never auto-delete it
    UpdateReplacePolicy: Retain
    Properties:
      TableName: jarvis-scout
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: project
          Value: jarvis-scout
        - Key: owner
          Value: jarvis

  # ---------------------------------------------------------------------
  # The scout itself.
  # ---------------------------------------------------------------------
  ScoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: jarvis-scout
      CodeUri: ./
      Handler: src/app.handler
      Description: Stage 1 find-and-log. Never posts. Calls no model.
      Environment:
        Variables:
          SCOUT_TABLE: !Ref ScoutTable
          SCOUT_CONFIG: /var/task/config.toml
      Role: !GetAtt ScoutRole.Arn
      Events:
        Daily:
          Type: ScheduleV2
          Properties:
            Name: jarvis-scout-daily
            # ScheduleV2 (EventBridge Scheduler) takes a timezone, so 07:00
            # stays 07:00 through the BST/GMT change. A plain cron rule is
            # UTC-only and would drift by an hour twice a year.
            ScheduleExpression: !Sub 'cron(0 ${DigestHour} * * ? *)'
            ScheduleExpressionTimezone: Europe/London
            State: !If [ScheduleOn, ENABLED, DISABLED]
            Description: JARVIS scout daily digest, 07:00 UK.
      Tags:
        project: jarvis-scout
        owner: jarvis

  # ---------------------------------------------------------------------
  # Least-privilege runtime role.
  #
  # The scout can write to its own table and send email as the two
  # addresses below. It cannot read any other table, reach Secrets Manager,
  # assume another role, or call Bedrock or any other model service. It has
  # no network permissions to the heartbeat-memory worker beyond ordinary
  # public egress, and no credential that would let it authenticate there.
  # ---------------------------------------------------------------------
  ScoutRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: jarvis-scout-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: own-table-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:TransactWriteItems
                Resource: !GetAtt ScoutTable.Arn
              # Deliberately absent: DeleteItem and UpdateItem. The scout
              # appends; it has no reason to be able to rewrite or remove a
              # chain entry, so it is not given the ability.
        - PolicyName: draft-with-one-model-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Stage 2 writes drafts, which means a model call, which the
              # role could not make at all: it had no bedrock permission of
              # any kind. Granted for one model id and nothing else, so a
              # config edit cannot quietly move the drafting to a model
              # nobody chose.
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/qwen.qwen3-235b-a22b-2507-v1:0'
                  - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/qwen.qwen3-235b-a22b-2507-v1:0'
        - PolicyName: send-digest-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ses:SendEmail
                Resource: '*'
                Condition:
                  StringEquals:
                    ses:FromAddress:
                      # Every address config.toml may put in `sender` has to
                      # be here, or the digest dies with AccessDenied on the
                      # first day something clears the threshold. Changing
                      # the sender in config alone is not enough, and testing
                      # it with an operator's own credentials proves the
                      # wrong thing: the Lambda sends as this role.
                      - paulblatherwick@heartbeat-framework.org
                      - scout@heartbeat-framework.org
                      - Paulbla30@hotmail.com
              - Effect: Allow
                Action: ses:ListEmailIdentities
                Resource: '*'
        - PolicyName: own-logs-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/jarvis-scout*'
      Tags:
        - Key: project
          Value: jarvis-scout

  # ---------------------------------------------------------------------
  # The accept function.
  #
  # A Function URL Paul opens from the digest. GET renders the draft and is
  # safe for a mail scanner to prefetch; the decision is a POST from that
  # page. AuthType NONE is deliberate: the HMAC token in the link is the
  # authentication, and it is scoped to one proposal, expires, and only
  # authorises *deciding* — there is no URL anywhere that means "approve".
  # ---------------------------------------------------------------------
  ApproveFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: jarvis-scout-approve
      CodeUri: ./
      Handler: src/approve_app.handler
      Description: Shows Paul a draft, takes his decision, and posts on approval.
      # Long enough for create -> solve -> verify inside Moltbook's five
      # minute challenge window, with room for a retry. Not longer: Paul is
      # waiting on this page for the real answer.
      Timeout: 60
      Environment:
        Variables:
          SCOUT_TABLE: !Ref ScoutTable
          SCOUT_APPROVAL_PARAM: !Ref ApprovalSecretName
          SCOUT_MOLTBOOK_PARAM: /jarvis/scout/moltbook-api-key
      Role: !GetAtt ApproveRole.Arn
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED
      Tags:
        project: jarvis-scout
        owner: jarvis

  ApproveRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: jarvis-scout-approve-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: proposals-and-chain
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:TransactWriteItems
                Resource: !GetAtt ScoutTable.Arn
              # UpdateItem is needed here (the scout itself does not get it)
              # because a decision changes a proposal's status. It still has
              # no DeleteItem: a decision is never erased, only superseded.
        - PolicyName: read-approval-key-and-moltbook-key
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                # The link-signing key, and the Moltbook key that lets an
                # approved draft actually post. Only this function gets the
                # second one: the scout has no write path and no need for it.
                Resource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ApprovalSecretName}'
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/jarvis/scout/moltbook-api-key'
              - Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'
        - PolicyName: draft-via-bedrock
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Inference only, on Anthropic models, through the inference
              # profile. Deliberately NOT bedrock:CreateModelCustomizationJob,
              # CreateProvisionedModelThroughput or anything that imports a
              # model: provisioned throughput on imported models is what
              # produced the $462 leak in September, and this role should not
              # be able to repeat it.
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub 'arn:aws:bedrock:*::foundation-model/anthropic.*'
                  - !Sub 'arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/us.anthropic.*'
        - PolicyName: own-logs-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/jarvis-scout-approve*'
      Tags:
        - Key: project
          Value: jarvis-scout

  ApproveLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/jarvis-scout-approve
      RetentionInDays: 90      # decisions matter longer than run logs

  ScoutLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/jarvis-scout
      RetentionInDays: 30        # logs are not the record; the chain is

Conditions:
  ScheduleOn: !Equals [!Ref Enabled, 'true']

Outputs:
  TableName:
    Value: !Ref ScoutTable
  FunctionName:
    Value: !Ref ScoutFunction
  RoleArn:
    Value: !GetAtt ScoutRole.Arn
  ApproveUrl:
    Description: Where approval links point. Paul opens this from the digest.
    Value: !GetAtt ApproveFunctionUrl.FunctionUrl
  VerifyCommand:
    Description: How to verify the hash chain from your own machine.
    Value: !Sub 'python3 scripts/verify_chain.py --table ${ScoutTable} --region ${AWS::Region}'
