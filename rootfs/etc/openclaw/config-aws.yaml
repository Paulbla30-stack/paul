# OpenClaw Agent Configuration - AWS AMI profile
# ==============================================
# Installed as /etc/openclaw/config.yaml on the AMI.  Instance-specific
# values (identity, user-data overrides, goals) land in
# /etc/openclaw/cloud.yaml, written by openclaw-bootstrap.service at boot
# and merged on top of this file.

agent:
  name: "OpenClaw"
  profile: "cloud"          # boot tasks: IMDS probe, memory, storage, scan
  max_tasks: 100
  memory_limit_mb: 512
  auto_plan: true

hardware:
  # EC2 instances have no framebuffer or physical input devices.
  display:
    enabled: false
  input:
    enabled: false
  memory:
    enabled: true
    max_map_mb: 256
  storage:
    enabled: true
    readonly: false          # set true for a read-only auditing agent

security:
  scan_on_boot: true
  enforce_hardening: false
  report_path: "/var/log/openclaw-security.log"

cloud:
  enabled: true
  provider: "aws"
  headless: true             # no console; run the loop as a service
  cycle_interval: 30         # seconds between idle cycles
  max_cycles: 0              # 0 = run forever
  status_host: "127.0.0.1"   # loopback only; use SSM/SSH to reach it
  status_port: 8471
  status_file: "/run/openclaw/status.json"
  status_token: null         # null = generated at start and written to the file below
  status_token_file: "/run/openclaw/token"   # 0600; needed for every call but /health, /status
  ui:                        # web UI: chat, agent panel, file uploads
    enabled: true
    host: "0.0.0.0"          # reachable only if the security group allows it (terraform ui_cidr)
    port: 8443
    tls: true                # self-signed certificate; the browser will warn once
    tls_dir: /etc/openclaw/tls
    upload_dir: /var/lib/openclaw/uploads
    max_upload_mb: 50

goals: []                    # add goals via user data or the openclaw:goal tag

# LLM planner. Enabled here, but it only runs when a key is available:
#   - /etc/openclaw/anthropic.key (0600), written at boot by
#     openclaw-bootstrap from llm.api_key_secret (AWS Secrets Manager) or
#     llm.api_key_ssm_parameter (SSM Parameter Store), set here, in user
#     data, or via the openclaw:llm-key-secret / openclaw:llm-key-parameter
#     tags, or
#   - ANTHROPIC_API_KEY in the service environment.
# Without a key the agent falls back to the rule-based planner and says so
# in the journal.
llm:
  enabled: true
  provider: anthropic        # anthropic (Claude API, needs the key below) | bedrock
  model: claude-opus-5       # bedrock: e.g. meta.llama3-3-70b-instruct-v1:0, an
                             # inference profile, or your imported model's ARN
                             # arn:aws:bedrock:REGION:ACCOUNT:imported-model/ID
  region: null               # bedrock: null = the instance's region
  bedrock:
    temperature: 0.2
    json_retries: 1          # re-ask once when the plan is not valid JSON
    not_ready_backoff: 45    # seconds to wait while an imported model loads
  effort: medium             # low | medium | high (xhigh/max need max_tokens >= 64000)
  thinking: adaptive         # adaptive | disabled (ignored on models without adaptive thinking)
  max_tokens: 4096
  fallbacks: true            # server-side refusal fallbacks (Claude API only)
  api_key_file: /etc/openclaw/anthropic.key
  api_key_secret: openclaw/anthropic-api-key   # AWS Secrets Manager name or ARN; the
                                # value may be the bare key or JSON with an
                                # ANTHROPIC_API_KEY / api_key field. Tried first.
  api_key_ssm_parameter: null   # or an SSM SecureString, e.g. /openclaw/anthropic-api-key.
                                # User data and the openclaw:llm-key-* tags override both.
  max_calls_per_hour: 60     # hard budget; rule planner takes over beyond it
  plan_every_n_cycles: 1
  history_window: 10
  shell:
    enabled: true            # let the brain run commands (deny-list guarded)
    timeout: 60
    max_output: 4000
    cwd: /
    deny_patterns: null      # extra patterns, ADDED to the built-in list
    replace_deny_patterns: false   # true = use only deny_patterns (not recommended)
    allow_package_install: false   # true = let the planner run dnf/apt/pip install
