# Jarvis Agent Configuration
# =============================

agent:
  name: "Jarvis"
  max_tasks: 100
  memory_limit_mb: 512
  auto_plan: true

hardware:
  display:
    enabled: true
    framebuffer: "/dev/fb0"

  input:
    enabled: true
    grab_exclusive: false

  memory:
    enabled: true
    max_map_mb: 256

  storage:
    enabled: true
    readonly: false

security:
  scan_on_boot: true
  enforce_hardening: false
  report_path: "/var/log/jarvis-security.log"
