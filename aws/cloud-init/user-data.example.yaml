#cloud-config
# Example EC2 user data for an OpenClaw agent-first instance.
#
# openclaw-bootstrap.service reads this block through IMDS at every boot
# and writes /etc/openclaw/cloud.yaml, which the agent merges on top of
# /etc/openclaw/config.yaml.  Everything under `openclaw:` is optional.
#
# Goals may also be given without user data by tagging the instance with
#   openclaw:goal = "<text>"     and/or     openclaw:name = "<agent name>"
# (enable "Allow tags in instance metadata" on the instance).

openclaw:
  agent:
    name: paul-life-agent

  goals:
    - description: Keep the root filesystem under 80% used
      priority: 2
    - description: Report security posture every cycle
      priority: 5
    - Watch memory pressure and log when above 90%

  cloud:
    cycle_interval: 30        # seconds between idle cycles
    status_port: 8471         # loopback status endpoint (0 disables)

  security:
    scan_on_boot: true
    enforce_hardening: false

  # LLM planner. The key itself never goes in user data: point at an SSM
  # SecureString the instance role can read and the bootstrap writes it to
  # /etc/openclaw/anthropic.key (0600) at every boot.  (An inline
  # `api_key:` is accepted for quick tests; it is moved to the key file and
  # stripped from cloud.yaml, but anyone who can read user data can read it.)
  llm:
    enabled: true
    model: claude-opus-5
    effort: medium
    api_key_ssm_parameter: /openclaw/anthropic-api-key
    max_calls_per_hour: 60
    shell:
      enabled: true          # brain may run deny-list-guarded commands

# Regular cloud-init keys still work alongside the openclaw block:
# packages:
#   - htop
